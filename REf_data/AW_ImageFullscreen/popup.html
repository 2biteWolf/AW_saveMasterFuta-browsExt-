<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    :root {
      --bg: #0d0d0d;
      --text: #e0ffe0;
      --muted: #6a8a6a;
      --accent: #39ff14;
      --border: #2a4a2a;
      --input: #111;
    }
    * { box-sizing: border-box; }
    body {
      width: 300px;
      margin: 0;
      padding: 12px 14px 14px;
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 12.5px;
      line-height: 1.4;
    }
    h3 {
      margin: 0 0 4px;
      font-size: 14px;
      color: var(--accent);
      text-shadow: 0 0 8px rgba(57,255,20,0.3);
    }
    .sub { color: var(--muted); font-size: 11px; margin-bottom: 10px; }
    label.chk {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 6px 0;
      cursor: pointer;
    }
    input[type="checkbox"] {
      accent-color: var(--accent);
      width: 15px;
      height: 15px;
    }
    .row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 7px 0;
    }
    .row > span {
      min-width: 72px;
      color: var(--muted);
      font-size: 11.5px;
    }
    select, input[type="text"], input[type="color"] {
      background: var(--input);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 5px 8px;
      font-size: 12px;
      flex: 1;
    }
    select:focus, input[type="text"]:focus {
      outline: none;
      border-color: var(--accent);
    }
    input[type="color"] { width: 42px; padding: 2px; flex: 0; }
    .sep {
      border: none;
      border-top: 1px solid var(--border);
      margin: 10px 0;
    }
    button {
      width: 100%;
      padding: 7px;
      margin-top: 6px;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      font-size: 12.5px;
      cursor: pointer;
    }
    button.primary {
      background: var(--accent);
      color: #000;
    }
    button.primary:hover { filter: brightness(1.1); }
    button.sec {
      background: transparent;
      color: var(--accent);
      border: 1px solid var(--accent);
    }
    button.sec:hover { background: rgba(57,255,20,0.1); }
    #status {
      color: var(--accent);
      font-size: 11px;
      text-align: center;
      min-height: 16px;
      margin-top: 6px;
      opacity: 0;
      transition: opacity 0.2s;
    }
    #status.show { opacity: 1; }
    .hint { font-size: 10.5px; color: var(--muted); margin-top: 4px; }
  </style>
</head>
<body>
  <h3>AW_ImageFullscreen</h3>
  <div class="sub">Click image = cycle mode · Ctrl+S = save</div>

  <label class="chk" title="Master switch for the whole extension">
    <input type="checkbox" id="enabled"> Enable extension
  </label>
  <label class="chk" title="Intercept data:image / base64 tabs and open internal viewer">
    <input type="checkbox" id="dataUrls"> data:image / base64 tabs
  </label>
  <label class="chk" title="Apply modes on direct image documents (jpg/png opened as page)">
    <input type="checkbox" id="httpImages"> Direct image tabs
  </label>

  <div class="row" title="Default view mode applied when an image opens">
    <span>Mode</span>
    <select id="fitMode">
      <option value="none">1. Original</option>
      <option value="vertical">2. Fit height</option>
      <option value="fill">3. Stretch full</option>
      <option value="horizontal">4. Fit width + scroll</option>
    </select>
  </div>
  <div class="row" title="Background color behind the image">
    <span>Background</span>
    <input type="color" id="background" value="#000000">
  </div>

  <hr class="sep">

  <label class="chk" title="Use custom name pattern for downloaded files">
    <input type="checkbox" id="renameEnabled"> Rename downloads
  </label>
  <div class="row" title="Main part of the filename (saved)">
    <span>Base name</span>
    <input type="text" id="renameBase" placeholder="image" maxlength="60">
  </div>
  <div class="row" title="Optional prefix. Empty = name_N.ext only">
    <span>Prefix</span>
    <input type="text" id="renamePrefix" placeholder="optional" maxlength="30">
  </div>
  <div class="hint">prefix_base_1.ext or base_1.ext · counter auto</div>

  <hr class="sep">

  <div class="hint" style="margin-bottom:4px;">
    Alt+Shift+B — original<br>
    Alt+Shift+N — force PNG
  </div>
  <button class="sec" id="shortcuts" title="Open browser page to change or view hotkeys">Hotkey settings</button>
  <button class="primary" id="save" title="Save all settings above">Save settings</button>
  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
